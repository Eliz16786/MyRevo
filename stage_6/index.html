<script src="../javascripts/algorithm.js"></script>

<script>
    const headerWrap = document.querySelector('.header-wrap');
    const bodyWrap = document.querySelector('.body-wrap');

    bodyWrap.addEventListener('scroll', () => {
        headerWrap.scrollLeft = bodyWrap.scrollLeft;
    });
    
    window.onload = () => {
        const skipLoad = sessionStorage.getItem('skipLoad');

        if (skipLoad) {
            sessionStorage.removeItem('skipLoad');

            const board1 = document.querySelector('.whiteboard-frame1');
            const board2 = document.querySelector('.whiteboard-frame2');
            const line = document.querySelector('.line');
            const btn = document.querySelector('.circle');

            board1.classList.remove('animating2');
            board2.classList.remove('animating2');
            line.classList.remove('animating2');
            btn.classList.remove('animating2');

            board1.classList.add('no-animation');
            board2.classList.add('no-animation');
            line.classList.add('no-animation');
            btn.classList.add('no-animation');
        }
    };

    function previousPage() {
        sessionStorage.setItem('skipLoad', 'true');
        window.location.href = '/stage_4/'
    }

    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const dayNames   = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const dayTimes   = ["6:00","7:00","8:00","9:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00","23:00"];
    const examInfo = JSON.parse(localStorage.getItem('examInfo'));
    const unavailableInfo = JSON.parse(localStorage.getItem('unavailableInfo'));
    
    const timeOfDay = localStorage.getItem("timeOfDay");
    const exams = JSON.parse(localStorage.getItem('exams'));
    const age = localStorage.getItem("age");

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const currentWeekStart = new Date(today);
    currentWeekStart.setDate(today.getDate() - ((today.getDay() + 6) % 7));

    let weekStart = new Date();
    weekStart.setHours(0, 0, 0, 0);
    weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));

    function getWeekDays() {
        const days = [];
        for (let i = 0; i < 7; i++) {
            const d = new Date(weekStart);
            d.setDate(weekStart.getDate() + i);
            days.push(d);
        }
        return days;
    }

    function timetable() {
        const days = getWeekDays();
        const startDay = days[0];
        const endDay   = days[6];
        document.getElementById('weekLabel').textContent = `${startDay.getDate()} - ${endDay.getDate()} ${monthNames[endDay.getMonth()]} ${endDay.getFullYear()}`;

        const headers = document.getElementById('dayHeaders');
        headers.innerHTML = '<div style="margin-left: 0.7rem;">Time</div>';
        days.forEach((d, i) => {
            headers.innerHTML += `<div>${dayNames[i]} ${d.getDate()} ${monthNames[d.getMonth()].slice(0, 3)}</div>`;
        });

        const grid = document.getElementById('timeGrid');
        grid.innerHTML = '';

        dayTimes.forEach(time => {
            const hour = parseInt(time.split(':')[0]);
            const row = document.createElement('div');
            row.className = 'time-row';

            const label = document.createElement('div');
            label.className = 'time-label';
            label.textContent = time;
            row.appendChild(label);

            days.forEach( d => {
                const box = document.createElement('div');
                box.className = 'cal-day';

                const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                box.dataset.date = iso;
                box.dataset.hour = hour;

                row.appendChild(box);
            });

            grid.appendChild(row);
        });

        plotExams();
        plotUnavailable();
        plotRevision();

        const prevBtn = document.getElementById('prevBtn');
        if (weekStart <= currentWeekStart) {
            prevBtn.disabled = true;
        } else {
            prevBtn.disabled = false;
        }

        const nextBtn = document.getElementById('nextBtn');
        const lastExamWeekStart = getLastExamWeekStart();

        if (weekStart >= lastExamWeekStart) {
            nextBtn.disabled = true;
        } else {
            nextBtn.disabled = false;
        }
    }

    function getLastExamWeekStart() {
        let lastExamDate = null;

        examInfo.forEach(ex => {
            const [y, m, d] = ex.date.split('-').map(Number);
            const examDate = new Date(y, m - 1, d);

            if (!lastExamDate || examDate > lastExamDate) {
                lastExamDate = examDate;
            }
        });

        const weekStart = new Date(lastExamDate);
        weekStart.setDate(lastExamDate.getDate() - ((lastExamDate.getDay() + 6) % 7));
        return weekStart;
    }

    function plotExams() {
        if (!examInfo) return;

        let firstExamCell = null;

        examInfo.forEach(ex => {
            const [startH, startM] = ex.start.split(':').map(Number);
            const [endH, endM]     = ex.end.split(':').map(Number);

            const startHour = startH;
            const endHourExclusive = endM > 0 ? endH + 1 : endH;

        for (let h = startHour; h < endHourExclusive; h++) {
                const cell = document.querySelector(`.cal-day[data-date="${ex.date}"][data-hour="${h}"]`);
                if (cell) {
                    cell.classList.add('exam-slot');
                    cell.title = `${ex.name} (${ex.start}–${ex.end})`;
                    cell.innerHTML = `<span class="exam-name-cell">${ex.name}</span>`;
                    if (!firstExamCell) firstExamCell = cell;
                }
            }
        });
    }

    function plotUnavailable() {
        if (!unavailableInfo) return;

        unavailableInfo.forEach(item => {
            const [startH, startM] = item.start.split(':').map(Number);
            const [endH, endM]     = item.end.split(':').map(Number);

            const startHour = startH;
            const endHourExclusive = endM > 0 ? endH + 1 : endH;

            for (let h = startHour; h < endHourExclusive; h++) {
                const cell = document.querySelector(`.cal-day[data-date="${item.date}"][data-hour="${h}"]`);

                if (cell && !cell.classList.contains('exam-slot')) {
                    cell.classList.add('unavailable-slot');
                    cell.title = `${item.reason || 'Unavailable'} (${item.start}–${item.end})`;
                    cell.innerHTML = `<span class="exam-name-cell">${item.reason || 'Unavailable'}</span>`
                }
            }
        });
    }

    function changeWeek(num) {
        weekStart.setDate(weekStart.getDate() + num * 7);
        timetable();
    }

// Loops through every week from now until the last exam
function getAllWeeksTableHtml() {
    const originalWeekStart = new Date(weekStart);
    const lastWeek = getLastExamWeekStart();

    // Safety net: if something's wrong with the exam dates, just export the week currently on screen instead of breaking
    const finalWeek = (lastWeek instanceof Date && !isNaN(lastWeek)) ? lastWeek : currentWeekStart;

    let exportWeekStart = new Date(currentWeekStart);
    const weekSectionsHtml = [];

    while (exportWeekStart <= finalWeek) {
        weekStart = new Date(exportWeekStart);
        timetable();

        const pageBreak = weekSectionsHtml.length > 0 ? 'page-break-before: always;' : '';
        weekSectionsHtml.push(`<div style="${pageBreak}">${buildWeekTableHtml()}</div>`);

        exportWeekStart.setDate(exportWeekStart.getDate() + 7);
    }

    // Put the visible page back to whatever week the user was on
    weekStart = originalWeekStart;
    timetable();

    return weekSectionsHtml.join('');
}

function wordPage() {
    downloadWordDocument(getAllWeeksTableHtml());
}

function pdfPage() {
    printAsPdf(getAllWeeksTableHtml());
}

// Reads the week currently drawn and turns it into a plain HTML table with inline styles 
function buildWeekTableHtml() {
    const weekLabel = document.getElementById('weekLabel').textContent;

    const headerCellsHtml = Array.from(document.querySelectorAll('#dayHeaders > div'))
        .map(div => `<td style="border:1px solid #999999;padding:4px 6px;font-weight:bold;text-align:center;background:#f0e6ff;font-size:11px;">${div.textContent.trim()}</td>`)
        .join('');

    let rowsHtml = '';
    document.querySelectorAll('#timeGrid .time-row').forEach(row => {
        let rowCellsHtml = '';

        row.querySelectorAll('.time-label, .cal-day').forEach(cell => {
            const isTimeLabel = cell.classList.contains('time-label');

            let background = '#FFFFFF';
            if (cell.classList.contains('exam-slot')) background = '#f9a8a8';
            else if (cell.classList.contains('unavailable-slot')) background = '#d4c9f9';
            else if (cell.classList.contains('revision-slot')) background = '#fde4b0';

            const nameSpan = cell.querySelector('.exam-name-cell');
            const text = nameSpan ? nameSpan.textContent : cell.textContent;

            const align = isTimeLabel ? 'right' : 'center';
            const weight = isTimeLabel ? 'bold' : 'normal';

            rowCellsHtml += `<td style="border:1px solid #999999;padding:3px 5px;background:${background};text-align:${align};font-weight:${weight};font-size:9px;white-space:nowrap;">${text}</td>`;
        });

        rowsHtml += `<tr>${rowCellsHtml}</tr>`;
    });

    return `
        <h2 style="font-family:Calibri,sans-serif;margin-bottom:8px;">${weekLabel}</h2>
        <table style="border-collapse:collapse;font-family:Calibri,sans-serif;">
            <tr>${headerCellsHtml}</tr>
            ${rowsHtml}
        </table>
    `;
}

// Wraps every week's table in a Word-compatible HTML document
function downloadWordDocument(weekSectionsHtml) {
    const htmlDoc = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
        <head>
            <meta charset="utf-8">
            <title>MyRevo Timetable</title>
            <!--[if gte mso 9]>
            <xml>
                <w:WordDocument>
                    <w:View>Print</w:View>
                    <w:Zoom>90</w:Zoom>
                </w:WordDocument>
            </xml>
            <![endif]-->
            <style>
                @page {
                    size: 841.9pt 595.3pt;
                    mso-page-orientation: landscape;
                    margin: 1cm;
                }
                body { font-family: Calibri, sans-serif; }
            </style>
        </head>
        <body>
            ${weekSectionsHtml}
        </body>
        </html>
    `;

    const blob = new Blob(['\ufeff', htmlDoc], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);

    const link = document.createElement('a');
    link.href = url;
    link.download = 'MyRevo_Timetable.doc';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

// Opens a new window with the same week tables, styled for print, then triggers the browser's print dialog
function printAsPdf(weekSectionsHtml) {
    const printWindow = window.open('', '_blank');

    if (!printWindow) {
        alert('Please allow pop-ups for this site to download a PDF.');
        return;
    }

    printWindow.document.write(`
        <html>
        <head>
            <meta charset="utf-8">
            <title>MyRevo Timetable</title>
            <style>
                @page {
                    size: A4 landscape;
                    margin: 1cm;
                }
                body { font-family: Calibri, sans-serif; }
                table { border-collapse: collapse; }
            </style>
        </head>
        <body>
            ${weekSectionsHtml}
        </body>
        </html>
    `);

    printWindow.document.close();

    printWindow.onload = () => {
        printWindow.focus();
        printWindow.print();
    };
}

function nextPage() {
    setTimeout(() => {
        window.location.href = '/';
    }, 100);
}

timetable();
</script>
